# AI-Media2Doc · discover 模块配置（5 维筛选规则）
#
# 维护原则：
#   - 修改本文件后无需重启 PM2，下次触发自动读最新（filters/scorer 每次调用都 reload）
#   - 关键词/账号/话题/阈值/触发器全部可热更新

# ────────────────────────────────────────────────
# 维度 1: 关键词搜索
# ────────────────────────────────────────────────
# 平台支持：
#   小红书 ✅ xhs-cli search（笔记+视频，已实测通过）
#   抖音   ❌ search API 反爬死锁（dy-cli/Evil0ctal/TikTokDownloader 均失败）
#         → 抖音侧不做关键词搜索，用账号订阅+点赞流替代
keywords:
  - 销售
  - 销冠
  - 创业
  - 认知
  - 底层逻辑
  - 销售技巧
  - 私域
  - 成交
  - 谈单
  - 私域营销
  - 私域成交

# ────────────────────────────────────────────────
# 维度 2: 账号订阅（最高价值维度）
# ────────────────────────────────────────────────
# 抖音侧扩展（基于 douyin-downloader v2.0.0 现有能力）：
#   - posts:    get_user_post（新发布作品）
#   - likes:    get_user_like（账号点赞流 = 隐藏的高质量发现路径，
#                              你信任的博主点赞 = 比关键词搜索更纯净的信号）
#   - collects: get_user_collect_mix（账号收藏 = 深度推荐信号）
accounts:
  xiaohongshu:
    # 格式：{nickname: 显示名, user_id: 24位hex}
    # 获取 user_id：访问账号主页 → URL 中 /user/profile/<user_id>
    # 示例：
    # - {nickname: 白雪姐姐聊商业, user_id: 67387cd4000000001c019bdd}
    []
  douyin:
    # 格式：{nickname: 显示名, sec_uid: 抖音sec_uid, scan: [posts, likes, collects]}
    # 获取 sec_uid：访问抖音 web 主页 → URL 中 sec_uid 参数
    # scan 控制扫哪些子流（默认 [posts, likes]，加 collects 可深度发现）
    []

# ────────────────────────────────────────────────
# 维度 3: 话题标签
# ────────────────────────────────────────────────
# 平台支持：
#   小红书 ✅ xhs-cli topics
#   抖音   ❌ 抖音不做话题（同 search 反爬限制）
topics:
  - "#销售技巧"
  - "#销冠思维"
  - "#创业心得"

# ────────────────────────────────────────────────
# 维度 4: 平台热门榜
# ────────────────────────────────────────────────
# 平台支持：
#   小红书 ✅ xhs-cli hot（视频/笔记列表）
#   抖音   ⚠️ dy-cli trending（仅热搜词列表，**不是视频**）→ 写入候选清单的特殊行，状态="热搜词"
trending:
  xiaohongshu:
    enable: true
    top_n: 20         # 拿热门视频/笔记前 N
  douyin:
    enable: true
    top_n: 30         # 拿热搜词前 N（不是视频，用来感知抖音今日话题热度）

# ────────────────────────────────────────────────
# 业务关联词库（用于热搜词高亮 · 不影响候选清单）
# ────────────────────────────────────────────────
# 抖音 30 条热搜词里，含以下任一词的会标 ⭐ + 排在前面
# 作用：让你在每天看抖音热搜词时，一眼看出哪些跟"销售/创业/IP/私域"业务关联
business_signal_keywords:
  # 创业 / 商业环境
  - 创业
  - 破产
  - 裁员
  - 失业
  - 降薪
  - 招聘
  - 经济
  - 股市
  - 楼市
  # 财富 / 副业 / 职场
  - 副业
  - 赚钱
  - 财富
  - 暴富
  - 收入
  - 工资
  - 35岁
  - 中年危机
  - 打工
  - 老板
  - 职场
  - 升职
  - 学历
  # 销售 / 电商 / 带货
  - 李佳琦
  - 带货
  - 直播间
  - 直播带货
  - 电商
  - 网红
  - 流量
  - 变现
  - 退货
  - 双11
  - "618"
  # 个人 IP / 私域
  - 私域
  - 朋友圈
  - 微商
  - 博主
  - 转型
  - 考公
  - 考研

# ────────────────────────────────────────────────
# 黑名单（在 filter 层 drop，连候选清单都不写入）
# ────────────────────────────────────────────────
# 实测候选清单常出现的噪音：
#   - 解压玩具 / 猪猪球（卖货号，借商业标签蹭流量）
#   - 追女生 / 男性觉醒（情感号，混在"销售"关键词里）
#   - 剧情号 / 段子 / 沙雕（娱乐导向，跟商业垂类无关）
#   - 星座 / 塔罗 / 算命（玄学号）
#   - 美妆 / 穿搭 / 健身（垂类不对口）
blacklist:
  keywords:
    # 卖货 / 解压号
    - 解压玩具
    - 猪猪球
    # 情感 / 男女相关
    - 追女生
    - 追男生
    - 男性成长
    - 男性觉醒
    - 泡妞
    - 相亲
    - 姻缘
    # 玄学
    - 星座
    - 塔罗
    - 算命
    - 占卜
    # 剧情 / 娱乐
    - 剧情
    - 小品
    - 演绎
    - 段子
    - 反转
    - 沙雕
    # 剧情 / 娱乐扩展（2026-05-17，小红书剧情号变体覆盖）
    - 短剧
    - 微剧
    - 情景剧
    - 喜剧
    - 搞笑剧
    - 戏剧
    - 翻拍
    - 模仿秀
    - 演员
    - 剧本
    - 剧场
    - 故事会
    - 讲故事
    - 奇葩故事
    # 不对口垂类
    - 萌宠
    - 穿搭
    - 美食测评
    - 美妆
    - 美甲
    - 减脂
    - 健身
  authors:
    # 实测命中：抖音卖解压玩具的号
    - 做睫毛的温老板
    # 情感号
    - 浩威Loveology
  author_ids: []

# ────────────────────────────────────────────────
# 阈值分流（D3 + D4：候选清单 vs 自动改写）
# ────────────────────────────────────────────────
thresholds:
  # 满足任一条件 → 自动改写（走 main.py process()）
  auto_rewrite:
    xiaohongshu:
      like_count: 50000       # 点赞 ≥ 5万
      collect_count: 10000    # 且 收藏 ≥ 1万（AND）
    douyin:
      like_count: 200000      # 点赞 ≥ 20万

  # 满足才进候选清单（低于此就 drop）
  candidate_only:
    xiaohongshu:
      like_count: 1000
    douyin:
      like_count: 5000

# ────────────────────────────────────────────────
# 触发器
# ────────────────────────────────────────────────
triggers:
  cron:
    enable: true
    schedule: "0 8 * * *"
    notify_chat_id: "oc_ab18cbb0e84628fd39668b62286ed562"

  watcher:
    enable: true
    interval_minutes: 1440   # 24h × 60min，一天 1 次拉 KOL 新作品（小红书 KOL 日均发文 ≤ 3 条，1 次足够）
    only_for: [accounts]

  command:
    enable: true
    trigger_text: "/发现"
    notify_chat_id: "oc_ab18cbb0e84628fd39668b62286ed562"

# ────────────────────────────────────────────────
# 限流（防止 Claude 配额炸 + 飞书 API 限流）
# ────────────────────────────────────────────────
limits:
  daily_max_candidates: 500
  daily_max_auto_rewrite: 10
  dedupe_window_days: 30

# ────────────────────────────────────────────────
# 打分权重（scorer 用，0-100 分制）
# ────────────────────────────────────────────────
scoring:
  weights:
    interaction: 40
    keywords: 30
    account: 15
    topics: 10
    freshness: 5
